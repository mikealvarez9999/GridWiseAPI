name: docker

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/gridwiseapi

jobs:
  build-push-smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase image name
        run: echo "IMAGE=$(echo '${{ env.IMAGE }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the pushed image (health + one public sample in mock mode)
        run: |
          set -euo pipefail
          docker pull "$IMAGE:${{ github.sha }}"
          docker run -d --name gw -p 8000:8000 -e LLM_MOCK=1 -e GROQ_API_KEYS=dummy "$IMAGE:${{ github.sha }}"
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health | grep -q '"ok"'; then echo "health ok"; break; fi
            sleep 2
            if [ "$i" = 30 ]; then docker logs gw; exit 1; fi
          done
          python3 -c "import json; print(json.dumps(json.load(open('samples/public_cases.json'))['cases'][1]['input']))" > /tmp/req.json
          code=$(curl -s -o /tmp/resp.json -w '%{http_code}' -X POST http://localhost:8000/optimize-energy -H 'content-type: application/json' --data @/tmp/req.json)
          echo "POST -> $code"; head -c 400 /tmp/resp.json; echo
          [ "$code" = "200" ]
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:8000/optimize-energy -H 'content-type: application/json' --data '{bad')
          echo "malformed -> $code"; [ "$code" = "400" ]
          docker rm -f gw

      - name: Print digest
        run: |
          echo "### Image published" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${IMAGE}:latest" >> "$GITHUB_STEP_SUMMARY"
          echo "${IMAGE}:${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "${IMAGE}@${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
