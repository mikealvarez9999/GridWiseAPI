[project]
name = "gridwise-api"
version = "0.1.0"
description = "GridWise LLM-assisted energy optimization API (BUP CSE Fest 2026 preliminary)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "scipy>=1.13",
    "numpy>=1.26",
    "openai>=1.40",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = ["live: tests that call the real LLM provider (need GROQ_API_KEYS)"]
testpaths = ["tests"]

[tool.uv]
package = false
